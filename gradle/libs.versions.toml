[versions]
# ============== PLUGINS =================
# AGP
agp = "9.5.1"

#Kotlin
kotlin = "2.4.21"

# Hilt
hilt = "2.60.1"

# KSP (must match Kotlin exactly)
ksp = "2.3.6"


# ============== LIBRARIES =================

# androidx-compose-bom
androidxComposeBom = "2026.09.00"

# other androidx dependencies
androidxActivityCompose = "1.13.0"
androidxCoreKtx = "1.19.1"
androidxDatastorePreferences = "1.3.0"
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigationCompose = "2.10.2"
androidxComposeRuntime = "1.12.1"

# Room
androidxRoom = "2.8.5"

# vico
vico = "3.3.1"

#  ======= Test =====
junit = "4.13.2"
junitVintageEngine = "6.1.3"
junitJupiter = "6.1.3"
junitPlatformLauncher = "6.1.3"
kotlinxCoroutinesTest = "1.11.0"
robolectric = "4.17"


# ======= androidTest ========
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
junitKtx = "1.3.0"
hiltAndroidTesting = "2.60.1"
runner = "1.7.0"
testCoreKtx = "1.7.0"






[libraries]

#androidx-compose-bom
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "androidxComposeRuntime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# other androidx dependencies
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastorePreferences" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }

# google-dagger-hilt
google-dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-dagger-hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
google-dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# vico
patrykandpatrick-vico-compose = {group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico"}






# ===================== test ====================

# junit
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintageEngine" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatformLauncher" }

# jetbrains
jetbrains-kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

#roboelectric
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }





# ===================== androidTest ===============

# androidx
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "testCoreKtx" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }


# google-dagger-hilt
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hiltAndroidTesting" }






# ======================= debug ====================

#androidx
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }











[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
room = {id="androidx.room", version.ref = "androidxRoom" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-devtools-ksp = {id = "com.google.devtools.ksp", version.ref = "ksp"}
google-dagger-hilt-android = {id = "com.google.dagger.hilt.android", version.ref = "hilt"}